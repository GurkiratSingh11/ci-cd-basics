name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t ci-cd-backend ./backend

      - name: Start backend container
        run: docker run -d --name backend -p 3000:3000 ci-cd-backend

      - name: Wait for server to be ready
        run: sleep 3

      - name: Health check
        run: |
          curl -f http://localhost:3000/api/health
          echo ""

      - name: Stop container
        if: always()
        run: docker stop backend || true