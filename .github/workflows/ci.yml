name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t ci-cd-backend ./backend

      - name: Start backend container
        run: docker run -d --name backend -p 3000:3000 ci-cd-backend

      - name: Wait for server to be ready
        run: sleep 3

      - name: Health check
        run: |
          curl -f http://localhost:3000/api/health
          echo ""

      - name: Stop container
        if: always()
        run: docker stop backend || true

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Tag and push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/${OWNER_LOWER}/ci-cd-backend:latest
          docker tag ci-cd-backend "$IMAGE"
          docker push "$IMAGE"